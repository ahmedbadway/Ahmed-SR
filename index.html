    <!-- Runs before first paint: marks JS as available (scroll reveals may hide
         content only when this class exists) and applies a stored Arabic
         preference so returning visitors never see a left-to-right flash. -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          if (localStorage.getItem('ab-lang') === 'ar') {
            d.lang = 'ar';
            d.dir = 'rtl';
            d.classList.add('pre-ar');
          }
        } catch (e) {}
      })();
    </script>
